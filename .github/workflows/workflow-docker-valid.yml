name: Bookstore API Tests With Docker & History

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
#  schedule:
    # Run every Monday night at 2 AM UTC
#    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: qa
        type: choice
        options:
          - qa
          - staging
      test_groups:
        description: 'Test groups to run'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - smoke,regression
          - all

jobs:
  test:
    name: Run API Tests in Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t bookstore-tests .

      - name: Create folders for Allure results
        run: |
          mkdir -p allure-results test-results allure-report

      - name: Checkout gh-pages for history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-history

      - name: Copy existing history
        run: |
          mkdir -p allure-results/history

          if [ -d gh-pages-history/history ]; then
            cp -r gh-pages-history/history/* allure-results/history/
            echo "Restored history from gh-pages"
          else
            echo "No existing history found"
          fi

      - name: Run tests inside Docker
        run: |
          docker run --rm \
            -e ENV=${{ github.event.inputs.environment || 'qa' }} \
            -e API_BASE_URL=${{ secrets.API_BASE_URL }} \
            -v ${{ github.workspace }}/allure-results:/app/target/allure-results \
            -v ${{ github.workspace }}/test-results:/app/target/surefire-reports \
            bookstore-tests \
            bash -c "
              mvn test -Dmaven.test.failure.ignore=true -Dgroups=${{ github.event.inputs.test_groups || 'smoke'}}
            "

      - name: Generate Allure Report
        if: always()
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            -v ${{ github.workspace }}/allure-report:/app/allure-report \
            bookstore-tests \
            allure generate /app/allure-results --clean -o /app/allure-report

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.event.inputs.environment }}
          path: allure-results/
          retention-days: 30

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.event.inputs.environment }}
          path: allure-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.event.inputs.environment }}
          path: test-results/
          retention-days: 30

  deploy:
    name: Deploy Allure Report
    runs-on: ubuntu-latest
    needs: [ test ]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report-${{ github.event.inputs.environment }}
          path: allure-report

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [ test, deploy ]
    if: always()

    steps:
      - name: Notify success
        if: needs.test.result == 'success'
        run: echo "All tests passed successfully!"

      - name: Notify failure
        if: needs.test.result == 'failure'
        run: echo "Tests failed. Check the logs and Allure report."